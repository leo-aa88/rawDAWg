name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            package: deb
          - name: Windows 2022
            os: windows-2022
            package: msi
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ee9ba6ee2d6d # v4.3.1
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libjack-jackd2-dev libudev-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev lintian
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@7e1e2d0a10a5ec3a8ba5a7b1bf6e8bc8a9d7d49b # v2.9.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --workspace --release --locked
      - name: Fixtures
        run: cargo xtask fixtures
      - name: Headless verification suite
        run: cargo xtask verify --suite headless
      - name: Plugin verification suite
        run: cargo xtask verify --suite plugins
      - name: Headless render
        run: cargo xtask render --project fixtures/demo.rawdawg --output target/verification/demo.wav
      - name: Package (deb)
        if: runner.os == 'Linux'
        run: cargo xtask package --format deb
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package (msi + portable)
        if: runner.os == 'Windows'
        run: |
          cargo xtask package --format msi
          cargo xtask package --format portable
      - name: Upload packages (unsigned, CI evidence only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.os }}
          path: |
            target/package/*.deb
            target/package/*.msi
            target/package/*.zip
            target/package/SHA256SUMS
            target/package/lintian.txt
          if-no-files-found: warn
      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ matrix.os }}
          path: target/verification
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ee9ba6ee2d6d # v4.3.1
      - uses: EmbarkStudios/cargo-deny-action@30f817c6f72275c6d54dc744fbca09ebc958599f # v2.0.12
        with:
          command: check licenses advisories bans sources
