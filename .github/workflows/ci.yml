name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch supersedes a running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # no debug info in dev/test builds: with egui/wgpu it is most of target/, and the runners'
  # disks filled up during the plugin suite (release builds keep their line tables)
  CARGO_PROFILE_DEV_DEBUG: 0

# Actions are pinned to release commits (verified with `gh api repos/<owner>/<repo>/commits/<tag>`):
#   actions/checkout v7.0.1, Swatinem/rust-cache v2.9.3, actions/upload-artifact v7.0.2,
#   EmbarkStudios/cargo-deny-action v2.1.1 (runs cargo-deny 0.20.2, the version used locally).

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
          - name: Windows 2022
            os: windows-2022
    steps:
      - name: Free disk space (Ubuntu runner)
        if: runner.os == 'Linux'
        # preinstalled SDKs this project does not use; the debug + release builds, the plugin
        # bundles and the package need the room
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Disk space (Windows runner)
        if: runner.os == 'Windows'
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libjack-jackd2-dev libudev-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev lintian
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build release
        run: cargo build --workspace --release --locked
      - name: Fixtures
        run: cargo xtask fixtures
      - name: Headless verification suite
        run: cargo xtask verify --suite headless
      - name: Plugin verification suite
        run: cargo xtask verify --suite plugins
      - name: Headless render
        run: cargo xtask render --project fixtures/demo.rawdawg --output target/verification/demo.wav
      - name: Package (deb)
        if: runner.os == 'Linux'
        run: cargo xtask package --format deb
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package (msi + portable)
        if: runner.os == 'Windows'
        run: |
          cargo xtask package --format msi
          cargo xtask package --format portable
      - name: Upload Ubuntu package (unsigned)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rawdawg-ubuntu-deb-x86_64
          path: |
            target/package/*.deb
            target/package/SHA256SUMS
            target/package/lintian.txt
          if-no-files-found: error
      - name: Upload Windows binaries (unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rawdawg-windows-x86_64
          path: |
            target/package/*.msi
            target/package/*.zip
            target/package/SHA256SUMS
          if-no-files-found: error
      - name: Disk space after the build
        if: always()
        shell: bash
        run: df -h . || true
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: target/verification
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources
