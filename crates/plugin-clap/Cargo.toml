[package]
name = "rawdawg-plugin-clap"
description = "rawDAWg CLAP export: the flagship synth and every native effect family as CLAP plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rawdawg_clap"
crate-type = ["cdylib", "rlib"]

[dependencies]
rawdawg-types = { path = "../types" }
rawdawg-dsp = { path = "../dsp" }
rawdawg-synthesizer = { path = "../synthesizer" }
rawdawg-effects = { path = "../effects" }
rawdawg-plugin-api = { path = "../plugin-api" }
rawdawg-ui = { path = "../ui" }
serde_json = { workspace = true }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-plugin", "clack-host"] }

[dev-dependencies]
clack-host = { workspace = true, features = ["clack-plugin"] }
rawdawg-dsp = { path = "../dsp" }
