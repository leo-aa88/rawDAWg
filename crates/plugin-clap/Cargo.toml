[package]
name = "rawdawg-plugin-clap"
description = "rawDAWg CLAP export: wraps native processors (flagship synth first) as CLAP plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rawdawg_clap"
crate-type = ["cdylib", "rlib"]

[dependencies]
rawdawg-types = { path = "../types" }
rawdawg-dsp = { path = "../dsp" }
rawdawg-synthesizer = { path = "../synthesizer" }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-plugin", "clack-host"] }
clap-sys = { workspace = true }

[dev-dependencies]
clack-host = { workspace = true, features = ["clack-plugin"] }
rawdawg-dsp = { path = "../dsp" }
