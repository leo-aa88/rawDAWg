[package]
name = "rawdawg-plugin-vst3"
description = "rawDAWg VST3 export: thin COM adapter exposing the flagship synth and every native effect family"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rawdawg_vst3"
crate-type = ["cdylib", "rlib"]

[dependencies]
rawdawg-types = { path = "../types" }
rawdawg-dsp = { path = "../dsp" }
rawdawg-plugin-api = { path = "../plugin-api" }
rawdawg-ui = { path = "../ui" }
vst3 = { workspace = true }

[dev-dependencies]
libloading = { workspace = true }
rawdawg-effects = { path = "../effects" }
rawdawg-synthesizer = { path = "../synthesizer" }
serde_json = { workspace = true }
