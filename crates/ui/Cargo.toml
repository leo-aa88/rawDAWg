[package]
name = "rawdawg-ui"
description = "rawDAWg shared UI: dark theme, parameter widgets, software egui painter and the native plugin editor window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rawdawg-types = { path = "../types" }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
