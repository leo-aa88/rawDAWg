rawdawg-dsp = { path = "../dsp" }
clack-host = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-host"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
rawdawg-plugin-clap = { path = "../plugin-clap" }
