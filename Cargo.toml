[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/leo-aa88/rawDAWg"
publish = false

[workspace.dependencies]
# Infrastructure
anyhow = "1.0.105"
thiserror = "2.0.21"
log = "0.4.35"
env_logger = "0.11.12"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: exact float parsing, so saved states (waveform cycles, curves) do not drift
# by one ulp on every save/load (found by the project fuzz target).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
sha2 = "0.11.1"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
directories = "6.0.0"
indexmap = { version = "2.14.2", features = ["serde"] }
arrayvec = "0.7.8"
rand_chacha = "0.10.0"
rand_core = "0.10"
# Real-time primitives
rtrb = "0.4.1"
# DSP infrastructure
rustfft = "6.4.1"
realfft = "3.5.1"
rubato = "5.1.0"
# Audio files
hound = "3.5.1"
symphonia = { version = "0.6.1", default-features = false, features = ["pcm", "wav", "flac", "mp3"] }
flacenc = { version = "0.5.1", default-features = false }
# MIDI
midir = "0.11.1"
midly = "0.5.3"
# Audio I/O
cpal = "0.18.2"
# GUI
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts", "accesskit"] }
egui = "0.37.0"
# Plugin editors: native child windows without a windowing framework (an in-process plugin
# cannot own a winit event loop inside a host that already runs one)
x11rb = "0.14.0"
windows-sys = "0.61.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Plugin ABI
clack-plugin = "0.2.0"
clack-host = "0.2.0"
clack-extensions = { version = "0.2.0", features = ["audio-ports", "note-ports", "params", "state", "latency", "tail", "gui", "log", "timer", "posix-fd"] }
clap-sys = "0.6"
vst3 = "0.3.0"
libloading = "0.9.1"
libc = "0.2.191"
# CLI
clap = { version = "4.6.10", features = ["derive"] }
# Tests
proptest = "1.12.0"
assert_no_alloc = "1.1.2"

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
