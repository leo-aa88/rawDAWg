# cargo-deny configuration: license policy and advisory audit (QUAL-03).
[graph]
all-features = false
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "deny"
# Transitive, Linux-only D-Bus crates pulled by eframe 0.37's accesskit (AT-SPI
# accessibility bridge). Upstream merged them into zbus 6; accesskit_unix 0.24 still
# depends on the 5.x line. Unmaintained (not vulnerable); revisit on the next eframe bump.
ignore = [
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; pulled by accesskit_unix via eframe 0.37" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; pulled by accesskit_unix via eframe 0.37" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; pulled by accesskit_unix via eframe 0.37" },
]

[licenses]
version = 2
# Permissive licenses accepted without review. MPL-2.0 (Symphonia, audio_thread_priority)
# is file-level weak copyleft and compatible with the repository's AGPL-3.0-only LICENSE;
# it is listed explicitly so any new copyleft dependency fails the audit until reviewed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "BSL-1.0",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
  "0BSD",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace path dependencies carry no version requirement by design.
allow-wildcard-paths = true
deny = [
  # Prohibited by SPECIFICATION.md PLAT-06: no JUCE, no webview/browser delivery.
  { crate = "juce", reason = "no JUCE (PLAT-06)" },
  { crate = "wry", reason = "no webview delivery (PLAT-05/06)" },
  { crate = "tauri", reason = "no webview delivery (PLAT-05/06)" },
  { crate = "webview2-com", reason = "no webview delivery (PLAT-05/06)" },
  { crate = "openssl-sys", reason = "no network stack in the application" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
